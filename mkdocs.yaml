site_name: My First Coding (MFC)
site_description: Free, online learning platform for Phone, Tablet, Computer & Desktop. Learn programming anywhere — Baguio to the World.
site_author: bluebixt-indiedev
site_url: "https://blue-cannon.github.io/my-first-coding/"

repo_name: Blue-Cannon/my-first-coding
repo_url: "https://github.com/Blue-Cannon/my-first-coding"
edit_uri: "edit/main/docs/"

copyright: Copyright &copy; 2026 Blue-Cannon | Owner bluebixt-indiedev | Learn on Any Device

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    logo: material/laptop

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Learn on Phone: lessons/setup-phone.md

plugins:
  - search

extra:
  generator: false

extra_css:
  - stylesheets/extra.css
