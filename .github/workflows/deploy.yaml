name: Deploy

on:
  push: 
      branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - run: |
          git clone --depth 1 https://github.com/Blue-Cannon/my-first-coding.git . 
          git fetch origin --force --prune --prune-tags --depth 50 HEAD 
          cat .readthedocs.yaml 
          asdf global python 3.14.6 
          python -mvirtualenv $READTHEDOCS_VIRTUALENV_PATH 
          python -m pip install --upgrade --no-cache-dir pip setuptools 
          python -m pip install --upgrade --no-cache-dir sphinx 
          python -m pip install --exists-action=w --no-cache-dir -r docs/requirements.txt 
          python -m sphinx -T -j auto -b html -d _build/doctrees -D language=en . $READTHEDOCS_OUTPUT/html
